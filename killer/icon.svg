<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2415"/>
      <stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="78" fill="none" stroke="#e74c3c" stroke-width="10"/>

  <!-- Crossbones -->
  <g stroke="#f5e6a3" stroke-width="26" stroke-linecap="round">
    <line x1="130" y1="360" x2="382" y2="420"/>
    <line x1="382" y1="360" x2="130" y2="420"/>
  </g>
  <!-- bone knobs -->
  <g fill="#f5e6a3">
    <circle cx="130" cy="360" r="20"/>
    <circle cx="130" cy="420" r="20"/>
    <circle cx="382" cy="360" r="20"/>
    <circle cx="382" cy="420" r="20"/>
  </g>

  <!-- Skull -->
  <g>
    <path d="M256 90c-72 0-124 56-124 122 0 46 24 82 58 104v46c0 12 10 22 22 22h14v34c0 8 6 14 14 14h32c8 0 14-6 14-14v-34h14c12 0 22-10 22-22v-46c34-22 58-58 58-104 0-66-52-122-124-122z"
          fill="#f5e6a3" stroke="#1a1a1a" stroke-width="6"/>
    <!-- eyes -->
    <ellipse cx="212" cy="212" rx="30" ry="38" fill="#1a1a1a"/>
    <ellipse cx="300" cy="212" rx="30" ry="38" fill="#1a1a1a"/>
    <!-- nose -->
    <path d="M256 250 L238 284 L274 284 Z" fill="#1a1a1a"/>
    <!-- teeth -->
    <g fill="#1a1a1a">
      <rect x="214" y="330" width="16" height="26"/>
      <rect x="242" y="330" width="16" height="26"/>
      <rect x="270" y="330" width="16" height="26"/>
      <rect x="298" y="330" width="16" height="26"/>
    </g>
  </g>
</svg>
